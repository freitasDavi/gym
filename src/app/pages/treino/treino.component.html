<main class="min-h-screen w-full p-10 bg-zinc-800/80 rounded-lg">
  @if (usersTreino !== null && usersTreino.length > 0) { @for (treino of
  usersTreino; track treino.id) {
  <div
    routerLink="/calisthenics/{{ treino.id }}"
    class="w-60 h-40 p-4 rounded-xl cursor-pointer font-semibold"
    [ngClass]="
      treino.ativo
        ? {
            'bg-purple-400 hover:bg-purple-500': true
          }
        : {
            'bg-purple-200/50 hover:bg-purple-300/70': true
          }
    "
  >
    {{ treino.name }}
  </div>
  } }
</main>
